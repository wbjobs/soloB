[package]
name = "semantic-code-search"
version = "0.1.0"
description = "Semantic Code Search Desktop Application"
authors = ["you"]
edition = "2021"

[lib]
name = "semantic_code_search_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.6", features = ["dialog-open", "fs-read-dir", "fs-read-file", "path-all"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
walkdir = "2.4"
thiserror = "1.0"
anyhow = "1.0"
tokio = { version = "1.35", features = ["full"] }
futures = "0.3"
once_cell = "1.19"
parking_lot = "0.12"
uuid = { version = "1.6", features = ["v4"] }
dashmap = "5.5"
dirs = "5.0"
reqwest = { version = "0.11", features = ["blocking"] }
ndarray = "0.15"

[dependencies.onnxruntime]
version = "0.0.15"
default-features = false
features = ["model-fetching"]

[dependencies.tokenizers]
version = "0.19"

[dependencies.qdrant-client]
version = "1.7"
default-features = false
features = ["rustls"]

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
