syntax = "proto3";

package video_service;

option go_package = "go_gateway/proto";

message FilterConfig {
    string filter_type = 1;
    float intensity = 2;
    bytes params = 3;
}

message ChunkInfo {
    string upload_id = 1;
    int32 chunk_index = 2;
    int32 total_chunks = 3;
    int64 chunk_size = 4;
    int64 total_size = 5;
    string file_name = 6;
    bytes chunk_data = 7;
    string file_hash = 8;
}

message ChunkUploadResponse {
    string upload_id = 1;
    int32 chunk_index = 2;
    bool success = 3;
    string message = 4;
    int64 received_size = 5;
}

message UploadInitRequest {
    string file_name = 1;
    int64 file_size = 2;
    int32 total_chunks = 3;
    string file_hash = 4;
    repeated FilterConfig filters = 5;
}

message UploadInitResponse {
    string upload_id = 1;
    bool can_resume = 2;
    repeated int32 uploaded_chunks = 3;
    string message = 4;
}

message UploadStatusRequest {
    string upload_id = 1;
}

message UploadStatusResponse {
    string upload_id = 1;
    int32 uploaded_chunks = 2;
    int32 total_chunks = 3;
    float upload_progress = 4;
    string status = 5;
    bool completed = 6;
    string video_id = 7;
    float processing_progress = 8;
}

message CompleteUploadRequest {
    string upload_id = 1;
}

message CompleteUploadResponse {
    string upload_id = 1;
    string video_id = 2;
    bool success = 3;
    string message = 4;
}

message ProcessVideoRequest {
    bytes video_data = 1;
    string video_id = 2;
    repeated FilterConfig filters = 3;
    string output_format = 4;
}

message ProcessProgress {
    string video_id = 1;
    int32 current_frame = 2;
    int32 total_frames = 3;
    float progress_percent = 4;
}

message ProcessVideoResponse {
    string video_id = 1;
    bytes processed_video = 2;
    bool success = 3;
    string message = 4;
}

message ListFiltersRequest {}

message ListFiltersResponse {
    repeated string filter_names = 1;
}

service VideoService {
    rpc InitUpload(UploadInitRequest) returns (UploadInitResponse);
    rpc UploadChunk(stream ChunkInfo) returns (stream ChunkUploadResponse);
    rpc GetUploadStatus(UploadStatusRequest) returns (UploadStatusResponse);
    rpc CompleteUpload(CompleteUploadRequest) returns (CompleteUploadResponse);

    rpc ProcessVideo(ProcessVideoRequest) returns (stream ProcessProgress);
    rpc GetProcessedVideo(ProcessVideoRequest) returns (ProcessVideoResponse);
    rpc ListFilters(ListFiltersRequest) returns (ListFiltersResponse);
}
