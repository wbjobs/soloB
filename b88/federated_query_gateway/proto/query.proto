syntax = "proto3";

package federatedquery;

service QueryService {
  rpc ExecuteQuery (QueryRequest) returns (QueryResponse) {}
  rpc ExecuteQueryStream (QueryRequest) returns (stream QueryBatch) {}
  rpc ValidateQuery (ValidateRequest) returns (ValidateResponse) {}
  rpc GetTables (GetTablesRequest) returns (GetTablesResponse) {}
  rpc GetSchema (GetSchemaRequest) returns (GetSchemaResponse) {}
  rpc GetCacheStats (GetCacheStatsRequest) returns (GetCacheStatsResponse) {}
  rpc InvalidateCache (InvalidateCacheRequest) returns (InvalidateCacheResponse) {}
}

message QueryRequest {
  string sql = 1;
  bool use_cache = 2;
  int32 batch_size = 3;
}

message QueryResponse {
  bool success = 1;
  bytes data = 2;
  int32 row_count = 3;
  string schema = 4;
  string error = 5;
}

message QueryBatch {
  int32 batch_index = 1;
  int32 row_count = 2;
  bytes data = 3;
}

message ValidateRequest {
  string sql = 1;
}

message ValidateResponse {
  bool valid = 1;
  repeated string errors = 2;
}

message GetTablesRequest {}

message GetTablesResponse {
  map<string, TableList> tables = 1;
}

message TableList {
  repeated string tables = 1;
}

message GetSchemaRequest {
  string table_name = 1;
}

message GetSchemaResponse {
  string table = 1;
  string schema = 2;
  repeated Field fields = 3;
}

message Field {
  string name = 1;
  string type = 2;
}

message GetCacheStatsRequest {}

message GetCacheStatsResponse {
  bool cache_enabled = 1;
  int32 total_entries = 2;
  int64 total_memory_bytes = 3;
  int32 total_accesses = 4;
  int32 max_size = 5;
  int64 memory_limit_mb = 6;
  float avg_access_count = 7;
}

message InvalidateCacheRequest {
  string sql = 1;
}

message InvalidateCacheResponse {
  bool success = 1;
  string message = 2;
}
