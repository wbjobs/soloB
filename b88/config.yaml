server:
  http_port: 8000
  grpc_port: 50051
  host: "0.0.0.0"

datasources:
  mysql:
    - name: "mysql_db1"
      host: "localhost"
      port: 3306
      user: "root"
      password: "password"
      database: "test_db"
  
  postgresql:
    - name: "pg_db1"
      host: "localhost"
      port: 5432
      user: "postgres"
      password: "password"
      database: "test_db"
  
  mongodb:
    - name: "mongo_db1"
      host: "localhost"
      port: 27017
      user: ""
      password: ""
      database: "test_db"
  
  parquet:
    - name: "parquet_data"
      path: "./data/parquet"

cache:
  enabled: true
  lru_max_size: 100
  ttl_seconds: 3600
  memory_limit_mb: 512

query:
  timeout_seconds: 300
  max_rows_per_batch: 10000
  enable_pushdown: true
  enable_join_optimization: true

logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
