<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebGPU 体素引擎</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      overflow: hidden;
      background: #000;
      font-family: 'Consolas', 'Monaco', monospace;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
    #dev-console {
      position: fixed;
      top: 10px;
      left: 10px;
      background: rgba(0, 0, 0, 0.8);
      color: #0f0;
      padding: 15px;
      border-radius: 5px;
      font-size: 12px;
      min-width: 200px;
      z-index: 1000;
      border: 1px solid #0f0;
    }
    #dev-console h3 {
      margin-bottom: 10px;
      border-bottom: 1px solid #0f0;
      padding-bottom: 5px;
    }
    #dev-console .stat {
      margin: 5px 0;
      display: flex;
      justify-content: space-between;
    }
    #controls {
      position: fixed;
      bottom: 10px;
      left: 10px;
      background: rgba(0, 0, 0, 0.8);
      color: #fff;
      padding: 15px;
      border-radius: 5px;
      font-size: 12px;
      z-index: 1000;
      border: 1px solid #fff;
    }
    #controls h4 {
      margin-bottom: 8px;
    }
  </style>
</head>
<body>
  <div id="dev-console">
      <h3>开发者控制台</h3>
      <div class="stat"><span>FPS:</span><span id="fps">0</span></div>
      <div class="stat"><span>渲染耗时:</span><span id="gi-time">0ms</span></div>
      <div class="stat"><span>GPU耗时:</span><span id="gpu-time">0ms</span></div>
      <div class="stat"><span>内存占用:</span><span id="memory">0MB</span></div>
      <div class="stat"><span>已加载区块:</span><span id="chunks">0</span></div>
      <div class="stat"><span>可见区块:</span><span id="visible-chunks">0</span></div>
      <div class="stat"><span>顶点数量:</span><span id="vertices">0</span></div>
      <div class="stat"><span>粒子数:</span><span id="particles">0</span></div>
      <div class="stat"><span>掉落物:</span><span id="drop-items">0</span></div>
      <div class="stat"><span>时间:</span><span id="time">08:00</span></div>
    </div>
  <div id="controls">
    <h4>控制说明</h4>
    <div>WASD - 移动</div>
    <div>鼠标 - 视角</div>
    <div>空格 - 上升</div>
    <div>Shift - 下降</div>
    <div>左键 - 破坏方块</div>
    <div>右键 - 放置方块</div>
    <div>T - 切换昼夜</div>
    <div>F11 - 全屏</div>
  </div>
  <canvas id="canvas"></canvas>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
