global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alerts.yml"

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'dts-apiserver'
    static_configs:
      - targets: ['apiserver:8080']
    metrics_path: '/api/v1/metrics'
    scrape_interval: 5s

  - job_name: 'dts-executor'
    static_configs:
      - targets: ['executor:8081']
    metrics_path: '/metrics'
    scrape_interval: 5s

  - job_name: 'etcd'
    static_configs:
      - targets: ['etcd:2379']
    metrics_path: '/metrics'
    scrape_interval: 5s

  - job_name: 'kafka'
    static_configs:
      - targets: ['kafka:7071']
    metrics_path: '/metrics'
    scrape_interval: 5s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093
