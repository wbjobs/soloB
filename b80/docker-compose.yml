version: '3.8'

services:
  influxdb:
    image: influxdb:2.7
    container_name: http-flow-influxdb
    ports:
      - "8086:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=password123
      - DOCKER_INFLUXDB_INIT_ORG=my-org
      - DOCKER_INFLUXDB_INIT_BUCKET=http-events
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=my-token
    volumes:
      - influxdb_data:/var/lib/influxdb2
    networks:
      - http-flow-network
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: http-flow-backend
    ports:
      - "3000:3000"
    environment:
      - INFLUX_URL=http://influxdb:8086
      - INFLUX_TOKEN=my-token
      - INFLUX_ORG=my-org
      - INFLUX_BUCKET=http-events
    depends_on:
      - influxdb
    networks:
      - http-flow-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: http-flow-frontend
    ports:
      - "3001:80"
    depends_on:
      - backend
    networks:
      - http-flow-network
    restart: unless-stopped

volumes:
  influxdb_data:

networks:
  http-flow-network:
    driver: bridge
