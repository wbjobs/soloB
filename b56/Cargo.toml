[package]
name = "secure-notes-core"
version = "0.1.0"
edition = "2021"
description = "Secure notes encryption core"

[[bin]]
name = "secure-notes-core"
path = "src/main.rs"

[dependencies]
aes-gcm = "0.10.3"
rand = "0.8.5"
base64 = "0.21.7"
serde = { version = "1.0.193", features = ["derive"] }
serde_json = "1.0.108"
