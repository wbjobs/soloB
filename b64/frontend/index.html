<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>金融交易数据大屏</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="dashboard">
        <header class="dashboard-header">
            <h1>金融交易数据大屏</h1>
            <div class="control-panel">
                <button id="btnKLine" class="control-btn active" data-target="K线">K线</button>
                <button id="btnMA5" class="control-btn active" data-target="MA5">MA5</button>
                <button id="btnMA10" class="control-btn active" data-target="MA10">MA10</button>
                <button id="btnVolume" class="control-btn active" data-target="成交量">成交量</button>
            </div>
            <div class="header-info">
                <div class="info-item">
                    <span class="label">数据更新：</span>
                    <span id="dataStatus" class="value">正在连接...</span>
                </div>
                <div class="info-item">
                    <span class="label">交易数/秒：</span>
                    <span id="tradeCount" class="value">0</span>
                </div>
            </div>
        </header>
        
        <main class="dashboard-main">
            <div class="chart-container" id="mainChart"></div>
        </main>
        
        <footer class="dashboard-footer">
            <p>实时金融交易监控系统 | Powered by ECharts + FastAPI</p>
        </footer>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <script src="src/chart-config.js"></script>
    <script src="src/data-stream.js"></script>
    <script src="src/main.js"></script>
</body>
</html>
