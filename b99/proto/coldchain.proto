syntax = "proto3";

package coldchain;

message SensorData {
  string device_id = 1;
  int64 timestamp = 2;
  double temperature = 3;
  double humidity = 4;
  double latitude = 5;
  double longitude = 6;
  int32 battery = 7;
}

message CompressedData {
  string device_id = 1;
  repeated SensorData points = 2;
  int32 original_count = 3;
  int32 compressed_count = 4;
}

message Anomaly {
  string device_id = 1;
  string anomaly_type = 2;
  int64 start_time = 3;
  int64 end_time = 4;
  string description = 5;
  repeated SensorData context_data = 6;
  double severity = 7;
}

message SubmitDataRequest {
  SensorData data = 1;
}

message SubmitDataResponse {
  bool success = 1;
  string message = 2;
}

message BatchSubmitDataRequest {
  repeated SensorData data = 1;
}

message BatchSubmitDataResponse {
  bool success = 1;
  int32 received_count = 2;
  int32 compressed_count = 3;
}

message QueryAnomaliesRequest {
  string device_id = 1;
  int64 start_time = 2;
  int64 end_time = 3;
  double min_lat = 4;
  double max_lat = 5;
  double min_lng = 6;
  double max_lng = 7;
  repeated string anomaly_types = 8;
  int32 context_minutes = 9;
}

message QueryAnomaliesResponse {
  repeated Anomaly anomalies = 1;
  int32 total_count = 2;
}

message GetDeviceStatusRequest {
  string device_id = 1;
}

message DeviceStatus {
  string device_id = 1;
  bool is_online = 2;
  int64 last_seen = 3;
  double current_temperature = 4;
  double current_humidity = 5;
  int32 active_anomalies = 6;
  int64 data_count_24h = 7;
}

message GetDeviceStatusResponse {
  DeviceStatus status = 1;
}

service ColdChainService {
  rpc SubmitData(SubmitDataRequest) returns (SubmitDataResponse);
  rpc BatchSubmitData(BatchSubmitDataRequest) returns (BatchSubmitDataResponse);
  rpc QueryAnomalies(QueryAnomaliesRequest) returns (QueryAnomaliesResponse);
  rpc GetDeviceStatus(GetDeviceStatusRequest) returns (GetDeviceStatusResponse);
}
