[package]
name = "smith_waterman_wasm"
version = "0.1.0"
edition = "2021"
description = "Smith-Waterman local alignment algorithm implemented in Rust and compiled to WebAssembly"
license = "MIT"

[lib]
crate-type = ["cdylib"]
path = "src-rust/lib.rs"

[dependencies]
wasm-bindgen = "0.2.92"

[profile.release]
opt-level = "z"
lto = true

[target.wasm32-unknown-unknown]
rustflags = [
    "-C", "link-arg=--max-memory=2147483648",
    "-C", "link-arg=--initial-memory=16777216",
    "-C", "link-arg=--stack-first",
]
