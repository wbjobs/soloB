version: '3.8'

services:
  jaeger:
    image: jaegertracing/all-in-one:1.51
    container_name: jaeger
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      - LOG_LEVEL=info
    networks:
      - trace-platform

  api-service:
    build:
      context: ./backend
      dockerfile: Dockerfile.api
    container_name: api-service
    ports:
      - "8080:8080"
    environment:
      - JAEGER_ENDPOINT=http://jaeger:4318/v1/traces
    depends_on:
      - jaeger
    networks:
      - trace-platform

  order-service:
    build:
      context: ./backend
      dockerfile: Dockerfile.order
    container_name: order-service
    ports:
      - "8081:8081"
    environment:
      - JAEGER_ENDPOINT=http://jaeger:4318/v1/traces
    depends_on:
      - jaeger
    networks:
      - trace-platform

  inventory-service:
    build:
      context: ./backend
      dockerfile: Dockerfile.inventory
    container_name: inventory-service
    ports:
      - "8082:8082"
    environment:
      - JAEGER_ENDPOINT=http://jaeger:4318/v1/traces
    depends_on:
      - jaeger
    networks:
      - trace-platform

  payment-service:
    build:
      context: ./backend
      dockerfile: Dockerfile.payment
    container_name: payment-service
    ports:
      - "8083:8083"
    environment:
      - JAEGER_ENDPOINT=http://jaeger:4318/v1/traces
    depends_on:
      - jaeger
    networks:
      - trace-platform

  frontend:
    image: nginx:alpine
    container_name: trace-frontend
    ports:
      - "3000:80"
    volumes:
      - ./frontend:/usr/share/nginx/html
    depends_on:
      - api-service
    networks:
      - trace-platform

networks:
  trace-platform:
    driver: bridge
