[package]
name = "raytracer-backend"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4.4"
actix-cors = "0.6"
actix-web-actors = "4.2"
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"
rand = "0.8"
rand_distr = "0.4"
glam = "0.24"
thiserror = "1.0"
log = "0.4"
env_logger = "0.10"
bytes = "1.0"

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
