server:
  port: 8080

redis:
  host: localhost
  port: 6379
  password: ""
  db: 0
  ttl_seconds: 300

database:
  host: localhost
  port: 3306
  user: root
  password: password
  database: k8s_metrics
  charset: utf8mb4

clusters:
  - name: cluster-prod
    namespaces:
      - default
      - production
      - monitoring
  - name: cluster-staging
    namespaces:
      - default
      - staging
  - name: cluster-dev
    namespaces:
      - default
      - development
