[package]
name = "pdf_security_scanner"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
lopdf = "0.31"
regex = "1.10"
thiserror = "1.0"
console_error_panic_hook = "0.1"

[profile.release]
opt-level = "s"
