[package]
name = "task-crdt-server"
version = "0.1.0"
edition = "2021"
description = "CRDT-based task management API server with offline support"

[dependencies]
actix-web = "4"
actix-cors = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
thiserror = "1"
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
criterion = "0.5"
