apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "lowcode-platform.fullname" . }}-server
  labels:
    {{- include "lowcode-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  replicas: {{ .Values.server.replicaCount }}
  selector:
    matchLabels:
      {{- include "lowcode-platform.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        {{- include "lowcode-platform.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: server
    spec:
      containers:
        - name: server
          image: "{{ .Values.server.image.repository }}:{{ .Values.server.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.server.service.port }}
              protocol: TCP
          env:
            - name: NODE_ENV
              value: {{ .Values.server.env.NODE_ENV }}
            - name: PORT
              value: {{ .Values.server.env.PORT }}
            - name: CORS_ORIGIN
              value: {{ .Values.server.env.CORS_ORIGIN }}
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.server.secrets.JWT_SECRET.name }}
                  key: {{ .Values.server.secrets.JWT_SECRET.key }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.server.secrets.DATABASE_URL.name }}
                  key: {{ .Values.server.secrets.DATABASE_URL.key }}
          resources:
            {{- toYaml .Values.server.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
