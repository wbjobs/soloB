apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "lowcode-platform.fullname" . }}-web
  labels:
    {{- include "lowcode-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.web.replicaCount }}
  selector:
    matchLabels:
      {{- include "lowcode-platform.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        {{- include "lowcode-platform.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: web
    spec:
      containers:
        - name: web
          image: "{{ .Values.web.image.repository }}:{{ .Values.web.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.web.service.port }}
              protocol: TCP
          env:
            - name: NODE_ENV
              value: {{ .Values.web.env.NODE_ENV }}
            - name: PORT
              value: {{ .Values.web.env.PORT }}
            - name: API_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.web.secrets.API_BASE_URL.name }}
                  key: {{ .Values.web.secrets.API_BASE_URL.key }}
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
