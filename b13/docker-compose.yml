version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: lowcode-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: lowcode
      POSTGRES_PASSWORD: lowcode123
      POSTGRES_DB: lowcode
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lowcode"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: lowcode-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  server:
    build:
      context: .
      dockerfile: packages/server/Dockerfile
    container_name: lowcode-server
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://lowcode:lowcode123@postgres:5432/lowcode?schema=public
      JWT_SECRET: your-super-secret-jwt-key-change-in-production
      JWT_EXPIRES_IN: 7d
      PORT: 3000
      CORS_ORIGIN: http://localhost:3001
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./generated:/app/generated

  web:
    build:
      context: .
      dockerfile: packages/web/Dockerfile
    container_name: lowcode-web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3000/api
      API_BASE_URL: http://server:3000
      PORT: 3001
    ports:
      - "3001:3001"
    depends_on:
      - server

volumes:
  postgres_data:
  redis_data:
