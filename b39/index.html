<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebGPU Molecular Dynamics Viewer</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      
      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      }
      
      body {
        background: #1a1a2e;
        color: #ffffff;
      }
      
      #app {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
      }
      
      #canvas {
        width: 100%;
        flex: 1;
        display: block;
      }
      
      .controls {
        position: absolute;
        top: 20px;
        left: 20px;
        background: rgba(0, 0, 0, 0.7);
        padding: 20px;
        border-radius: 12px;
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        max-width: 320px;
      }
      
      .controls h1 {
        font-size: 18px;
        margin-bottom: 15px;
        font-weight: 600;
      }
      
      .control-group {
        margin-bottom: 15px;
      }
      
      .control-group label {
        display: block;
        margin-bottom: 8px;
        font-size: 14px;
        color: #aaa;
      }
      
      .file-input {
        display: block;
        width: 100%;
        padding: 10px;
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 6px;
        color: white;
        cursor: pointer;
        font-size: 13px;
      }
      
      .file-input:hover {
        background: rgba(255, 255, 255, 0.15);
      }
      
      input[type="range"] {
        width: 100%;
        cursor: pointer;
      }
      
      .slider-value {
        display: flex;
        justify-content: space-between;
        font-size: 12px;
        color: #888;
        margin-top: 5px;
      }
      
      .btn-group {
        display: flex;
        gap: 10px;
        margin-top: 10px;
      }
      
      button {
        flex: 1;
        padding: 10px 15px;
        background: #667eea;
        border: none;
        border-radius: 6px;
        color: white;
        font-size: 13px;
        cursor: pointer;
        transition: background 0.2s;
      }
      
      button:hover {
        background: #5a67d8;
      }
      
      button:disabled {
        background: #4a5568;
        cursor: not-allowed;
      }
      
      .info {
        position: absolute;
        bottom: 20px;
        left: 20px;
        background: rgba(0, 0, 0, 0.7);
        padding: 15px;
        border-radius: 8px;
        font-size: 13px;
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }
      
      .info div {
        margin: 5px 0;
      }
      
      .no-webgpu {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
        padding: 40px;
        background: rgba(0, 0, 0, 0.9);
        border-radius: 16px;
        border: 1px solid #ff6b6b;
      }
      
      .no-webgpu h2 {
        color: #ff6b6b;
        margin-bottom: 15px;
      }
      
      .no-webgpu p {
        color: #aaa;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="canvas"></canvas>
      
      <div class="controls" id="controls" style="display: none;">
        <h1>🧬 分子动力学查看器</h1>
        
        <div class="control-group">
          <label>加载 XYZ 文件</label>
          <input type="file" id="fileInput" accept=".xyz" class="file-input" />
          <button id="loadSample" style="margin-top: 10px; width: 100%;">加载示例数据</button>
        </div>
        
        <div class="control-group">
          <label>播放控制</label>
          <div class="btn-group">
            <button id="playBtn">▶ 播放</button>
            <button id="pauseBtn">⏸ 暂停</button>
            <button id="resetBtn">⏮ 重置</button>
          </div>
        </div>
        
        <div class="control-group">
          <label>帧: <span id="frameValue">0</span> / <span id="totalFrames">0</span></label>
          <input type="range" id="frameSlider" min="0" max="0" value="0" />
        </div>
        
        <div class="control-group">
          <label>播放速度</label>
          <input type="range" id="speedSlider" min="0.1" max="10" step="0.1" value="1" />
          <div class="slider-value">
            <span>0.1x</span>
            <span id="speedValue">1.0x</span>
            <span>10x</span>
          </div>
        </div>
        
        <div class="control-group">
          <label>原子大小: <span id="atomSizeValue">1.0</span></label>
          <input type="range" id="atomSizeSlider" min="0.2" max="3" step="0.1" value="1" />
        </div>
      </div>
      
      <div class="info" id="info" style="display: none;">
        <div>🖱️ 左键拖动: 旋转</div>
        <div>🖱️ 右键拖动 / Shift+左键: 平移</div>
        <div>🖱️ 滚轮: 缩放</div>
        <div id="fpsInfo"></div>
      </div>
    </div>
    
    <div id="no-webgpu" class="no-webgpu" style="display: none;">
      <h2>WebGPU 不可用</h2>
      <p>您的浏览器不支持 WebGPU。<br>请使用最新版本的 Chrome、Edge 或其他支持 WebGPU 的浏览器。</p>
    </div>
    
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
